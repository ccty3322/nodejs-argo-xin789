name: Deploy Node.js to anynines

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Install Cloud Foundry CLI
        run: |
          sudo rm -f /usr/local/bin/cf
          wget -q "https://packages.cloudfoundry.org/stable?release=linux64-binary" -O cf.tgz
          tar -xzf cf.tgz
          sudo mv cf /usr/local/bin/cf
          sudo chmod +x /usr/local/bin/cf
          cf version


      - name: Login anynines
        run: |
          cf api https://api.sg.a9s.eu
          cf auth "${{ secrets.CF_USERNAME }}" "${{ secrets.CF_PASSWORD }}"


      - name: Deploy
        run: |
          cf push
