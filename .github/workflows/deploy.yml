name: Deploy Node.js to anynines

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4


      # 安装 Cloud Foundry CLI
      - name: Install Cloud Foundry CLI
        run: |
          mkdir -p $HOME/cf-bin
          cd $HOME/cf-bin

          wget -q "https://packages.cloudfoundry.org/stable?release=linux64-binary" -O cf.tgz

          tar -xzf cf.tgz

          chmod +x cf

          echo "$HOME/cf-bin" >> $GITHUB_PATH

          ./cf version


      # 登录 anynines
      - name: Login anynines
        run: |
          cf api https://api.de.a9s.eu
          cf auth "${{ secrets.CF_USERNAME }}" "${{ secrets.CF_PASSWORD }}"


      # 自动选择 Org 和 Space
      - name: Target Org
        run: |
          echo "===== 当前目标 ====="
          cf target

          echo "===== Org列表 ====="
          cf orgs

          ORG=$(cf orgs | grep -v "Getting orgs" | grep -v "name" | grep -v "^$" | head -n 1)

          echo "选择 Org: $ORG"

          cf target -o "$ORG"


      # 部署 Node.js
      - name: Deploy application
        run: |
          cf push
